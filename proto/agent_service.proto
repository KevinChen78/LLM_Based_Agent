syntax = "proto3";
package agent.v1;

option cc_namespace = "agent::v1";

service AgentService {
    rpc Chat(ChatRequest) returns (ChatResponse);
    rpc SubmitFeedback(SubmitFeedbackRequest) returns (SubmitFeedbackResponse);
    rpc GetConversationHistory(GetConversationHistoryRequest) returns (GetConversationHistoryResponse);
}

message ChatRequest {
    string user_id = 1;
    string session_id = 2;
    string message = 3;
    string city = 4;
    double longitude = 5;
    double latitude = 6;
    string device_type = 7;
}

message RecommendationItem {
    string item_id = 1;
    string merchant_id = 2;
    string title = 3;
    string category = 4;
    double price = 5;
    double original_price = 6;
    double score = 7;
    string reason = 8;
    repeated string tags = 9;
}

message ChatResponse {
    string session_id = 1;
    string trace_id = 2;
    string reply = 3;
    repeated RecommendationItem items = 4;
    bool is_clarifying = 5;
    string next_state = 6;
}

message SubmitFeedbackRequest {
    string trace_id = 1;
    string session_id = 2;
    string item_id = 3;
    string feedback_type = 4;
    string comment = 5;
}

message SubmitFeedbackResponse {
    bool success = 1;
}

message GetConversationHistoryRequest {
    string session_id = 1;
    int32 limit = 2;
}

message ConversationTurn {
    int32 turn_id = 1;
    string role = 2;
    string content = 3;
    string created_at = 4;
}

message GetConversationHistoryResponse {
    string session_id = 1;
    repeated ConversationTurn turns = 2;
}
